# Keep the real production deserializers and manual acknowledgment. A fresh
# disposable consumer must also read messages produced during its startup.
bootstrap.servers=localhost:9092
group.id=group-chat
enable.auto.commit=false
max.poll.records=50
key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
value.deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.json.trusted.packages=com.example.demo.model.persistence.model
auto.offset.reset=earliest
